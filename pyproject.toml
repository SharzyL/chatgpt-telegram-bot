[project]
name = "chatgpt-telegram-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "SharzyL", email = "me@sharzy.in"},
    {name = "zzh1996", email = "zhengzihan1996@gmail.com"},
]
dependencies = [
    "Telethon<2.0.0,>=1.45.0",  # rich_message on SendMessageRequest/EditMessageRequest; KeyboardInlineButton
    "python-socks>=2.4.4,<3.0.1",
    "cryptg<1.0.0,>=0.4.0",
    "anthropic>=0.109.0,<1.12.2",
    "openai>=2.41.1,<3.0.0",
    # a stream that drops mid-reply raises the SDK's HTTP library's own error, unwrapped
    "httpx>=0.28.1",  # openai's
    "httpx2>=2.9.1",  # anthropic's
    "loguru>=0.7.2",
    "diskcache>=5.6.3",
    "mistune>=3.0.0,<4.0.0",  # markdown -> AST for client-side entity rendering
]
requires-python = "<4.0,>=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
chatgpt-telegram-bot = "chatgpt_telegram_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-system"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
