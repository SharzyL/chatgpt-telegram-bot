name: CI

on:
  push:
    branches: [ goshujin ]
  pull_request:
    branches: [ goshujin ]

jobs:
  nix-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build and test
        run: nix build

      - name: Type check
        run: nix develop -c basedpyright

      - name: Flake check
        run: nix flake check
