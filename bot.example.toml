admin_id = 114514
# allowed_chats = [114514, -1001234567890]  # admin is always allowed

# timezone = "Asia/Shanghai"  # default: UTC
# system_prompt = "Current date: {current_date}. Reply in the same language as the user sent you."  # supports {current_date}, {model}
# default_image_prompt = "Describe the image"
# default_image_reply_prompt = "Continue"
# image_cache_size = 52428800  # 50MB default

endpoints = [
  { name = "openai", url = "https://api.openai.com/v1" },
  { name = "anthropic", url = "https://api.anthropic.com" },
]
default_endpoint = "openai"

models = [
  { prefix = "g", name = "gpt-5", thinking = "medium" },

  # search and server-side markdown rendering are per model, and overridable inline with ,s and ,r
  { prefix = "gs", name = "gpt-5", thinking = "high", search = true, richtext = true },

  { prefix = "$", name = "claude-opus-4-5", endpoint = "anthropic", api_type = "anthropic" },

  { prefix = "t", name = "claude-sonnet-4-5", endpoint = "anthropic", api_type = "anthropic", system_prompt = "The user will send you some text and optionally a language name. You need to translate it into Chinese. If the user sends a single word, you should also include some expanations and usages. Note that your answer should also in Chinese." },

  # inline system prompt: g,[You are a helpful bot, current date {current_date}] hello
  # escaped brackets: g,[Respond with JSON like \[1,2,3\]] hello
]
