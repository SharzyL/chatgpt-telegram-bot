[project]
name = "chatgpt-telegram-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "SharzyL", email = "me@sharzy.in"},
    {name = "zzh1996", email = "zhengzihan1996@gmail.com"},
]
dependencies = [
    "Telethon<2.0.0,>=1.44.0",  # rich_message on SendMessageRequest/EditMessageRequest
    "python-socks>=2.4.4,<3.0.1",
    "cryptg<1.0.0,>=0.4.0",
    "anthropic>=0.109.0,<1.0.0",
    "openai>=2.41.1,<3.0.0",
    "loguru>=0.7.2",
    "diskcache>=5.6.3",
    "mistune>=3.0.0,<4.0.0",  # markdown -> AST for client-side entity rendering
]
requires-python = "<4.0,>=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
chatgpt-telegram-bot = "chatgpt_telegram_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-system"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
